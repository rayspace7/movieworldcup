<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 명작영화 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D12;
    --surface:#17151C;
    --surface-soft:#1F1C26;
    --gold:#D4AF37;
    --gold-deep:#A9832A;
    --gold-soft:#4A3F22;
    --ink:#F3EFE6;
    --ink-soft:#9C97A8;
    --ink-faint:#6B6678;
    --line:#2A2732;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100dvh;
    background:var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
  }
  .phone{
    width:100%;
    height:100dvh;
    background:var(--bg);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .screen.active{display:flex;}
  .screen.show{opacity:1; transform:translateY(0);}

  #screen-start{ align-items:center; justify-content:center; padding:32px 28px; text-align:center; }
  .start-emblem{
    width:76px; height:76px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
    margin-bottom:22px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:26px;
    line-height:1.4;
    margin:0 0 12px;
    color:var(--ink);
  }
  .start-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin-bottom:34px;
  }
  .cta{
    width:100%;
    max-width:260px;
    border:none;
    border-radius:999px;
    padding:15px 0;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:15.5px;
    color:#1A1610;
    background:linear-gradient(135deg, #F3D77A, var(--gold), var(--gold-deep));
    cursor:pointer;
    box-shadow:0 12px 26px rgba(212,175,55,0.28);
  }
  .cta:active{ transform:scale(0.98); }
  .cta.ghost{
    background:transparent;
    color:var(--gold);
    border:1.4px solid var(--gold-deep);
    box-shadow:none;
  }
  .error-msg{ font-size:12px; color:#E0665A; margin-top:14px; min-height:16px; }
  .category-list{
    width:100%; max-width:260px;
    display:flex; flex-direction:column; gap:10px;
  }

  #screen-genre{ align-items:center; justify-content:center; padding:32px 28px; text-align:center; }
  .genre-title{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:18px;
    color:var(--gold);
    margin-bottom:22px;
  }
  .genre-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
    max-width:300px;
    margin-bottom:22px;
  }
  .genre-btn{
    padding:14px 4px;
    border-radius:14px;
    border:1px solid var(--gold-deep);
    background:var(--surface);
    color:var(--ink);
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .genre-btn:active{ transform:scale(0.97); }
  .back-link{
    border:none; background:transparent;
    color:var(--ink-faint);
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
  }

  #screen-loading{ align-items:center; justify-content:center; text-align:center; }
  .film-spin{
    width:40px; height:40px;
    border:3px solid var(--surface-soft);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ margin-top:16px; font-size:13.5px; color:var(--ink-soft); }

  #screen-round{ padding:0; position:relative; }
  .round-progress{
    position:absolute; top:14px; right:18px; z-index:3;
    font-size:11.5px; color:var(--ink-faint);
  }
  .matchup{
    flex:1;
    position:relative;
    display:flex;
    gap:2px;
    padding:0 2px 2px;
  }
  .round-label{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:40px;
    z-index:6;
    white-space:nowrap;
    background:var(--surface);
    border:1px solid var(--gold-deep);
    border-radius:999px;
    padding:6px 18px;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:14px;
    color:var(--gold);
    box-shadow:0 6px 16px rgba(0,0,0,0.4);
  }
  .movie-card{
    flex:1;
    position:relative;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    background-color:#110F15;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 28px;
  }
  .movie-card::before, .movie-card::after{
    content:"";
    position:absolute; top:0; bottom:0; width:28px;
    background-repeat:repeat-y;
    background-size:28px auto;
    z-index:1;
  }

<body>

<div class="phone">

  <div class="screen active" id="screen-start">

    <div class="category-list">
      <button class="cta" onclick="startTournament('all')">모든 영화</button>
      <button class="cta ghost" onclick="goTo('screen-genre')">장르별 선택</button>
      <button class="cta ghost" onclick="startTournament('korean')">한국영화</button>
      <button class="cta ghost" onclick="startTournament('western')">서양영화</button>
      <button class="cta ghost" onclick="startTournament('asian')">아시아영화</button>

  <div class="screen" id="screen-round">
    <div class="round-progress" id="roundProgress">1 / 8매치</div>
    <div class="matchup">

          <div class="movie-year" id="yearA"></div>

        </div>
      </div>

          <img id="imgB" src="" alt="">
          <div class="movie-title" id="titleB"></div>
          <div class="movie-year" id="yearB"></div>

    <div class="winner-year" id="winnerYear"></div>

    <div class="error-msg" id="resultError"></div>
  </div>

  <div class="round-popup" id="roundPopup">
    <div class="round-popup-card">
      <div class="round-popup-text" id="roundPopupText"></div>

  <div class="ad-modal" id="adModal">

</div>

<script type="module">

function renderGenreGrid(){

    `<button type="button" class="genre-btn" onclick="startTournament('genre', ${g.id})">${g.name}</button>`

}
renderGenreGrid();

function showRoundPopup(text, duration = 850){
  return new Promise((resolve) => {
    const el = document.getElementById('roundPopup');
    document.getElementById('roundPopupText').textContent = text;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(resolve, 250);
    }, duration);
  });
}

function positionRoundLabel(){
  const img = document.getElementById('imgA');
  const matchup = document.querySelector('.matchup');
  const label = document.getElementById('roundLabel');
  if (!img || !matchup || !label) return;
  const imgRect = img.getBoundingClientRect();
  const matchupRect = matchup.getBoundingClientRect();
  if (imgRect.height === 0) return;
  const top = imgRect.top - matchupRect.top - label.offsetHeight - 10;
  label.style.top = Math.max(10, top) + 'px';
}
window.addEventListener('resize', positionRoundLabel);

window.addEventListener('DOMContentLoaded', ()=>{
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    document.getElementById(currentScreen).classList.add('show');
  }));
  history.replaceState({ screen: 'screen-start' }, '');
});

window.addEventListener('popstate', (e) => {
  switchScreen(e.state?.screen || 'screen-start');
});

function switchScreen(id){
  if (id === currentScreen) return;
  document.getElementById(currentScreen).classList.remove('active','show');
  const next = document.getElementById(id);
  next.classList.add('active');
  requestAnimationFrame(()=> requestAnimationFrame(()=> next.classList.add('show')));
  currentScreen = id;
}
function goTo(id){ history.pushState({ screen: id }, ''); switchScreen(id); }
function replaceWith(id){ history.replaceState({ screen: id }, ''); switchScreen(id); }

const AD_GROUP_ID_INTERSTITIAL = "ait.v2.live.82a2fa9ce30e4f21";
let interstitialLoaded = false;

function preloadInterstitial(){
  if (!safeIsSupported(() => loadFullScreenAd.isSupported())) return;
  interstitialLoaded = false;
  loadFullScreenAd({
    options: { adGroupId: AD_GROUP_ID_INTERSTITIAL },
    onEvent: (e) => { if (e.type === 'loaded') interstitialLoaded = true; },
    onError: (e) => console.error('전면 광고 로드 실패:', e),
  });
}
preloadInterstitial();

function withInterstitialIfNeeded(proceed){
  const shouldShowAd = interstitialLoaded && safeIsSupported(() => showFullScreenAd.isSupported());
  if (!shouldShowAd) { proceed(); return; }
  showFullScreenAd({
    options: { adGroupId: AD_GROUP_ID_INTERSTITIAL },
    onEvent: (e) => {
      if (e.type === 'dismissed' || e.type === 'failedToShow') { preloadInterstitial(); proceed(); }
    },
    onError: (e) => { console.error('전면 광고 노출 실패:', e); preloadInterstitial(); proceed(); },
  });
}

document.getElementById('adModalConfirm').addEventListener('click', () => {
  document.getElementById('adModal').classList.remove('show');
  withInterstitialIfNeeded(beginNewTournament);
});

async function fetchRandom16(){
  const params = new URLSearchParams();
  params.set('category', currentCategory);
  if (currentCategory === 'genre' && currentGenreId) params.set('genre', String(currentGenreId));
  const response = await fetch(`${API_BASE}/api/movies/random16?${params.toString()}`, {
    signal: AbortSignal.timeout(60000)
  });
  if (!response.ok) {
    let message = `영화 목록을 불러오지 못했어요: ${response.status}`;
    try { const b = await response.json(); if (b?.error) message = b.error; } catch(_){}
    throw new Error(message);
  }
  const data = await response.json();
  return data.movies;
}

let spareQueue = [];

async function getSpareMovie(excludeIds){
  for (let attempt = 0; attempt < 6; attempt++){
    if (spareQueue.length === 0){
      const batch = await fetchRandom16();
      spareQueue.push(...batch);
    }
    const candidate = spareQueue.shift();
    if (candidate && !excludeIds.has(candidate.id)) return candidate;
  }
  return null;
}

async function submitResult(winner){
  const response = await fetch(`${API_BASE}/api/movies/result`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ winnerId: winner.id, winnerTitle: winner.title }),
    signal: AbortSignal.timeout(20000)
  });
  if (!response.ok) throw new Error(`결과 저장에 실패했어요: ${response.status}`);
  return await response.json();
}

async function startTournament(category = 'all', genreId = null){
  currentCategory = category;
  currentGenreId = genreId;
  spareQueue = [];
  document.getElementById('startError').textContent = '';
  goTo('screen-loading');
  let i = 0;
  const phraseEl = document.getElementById('loadingText');
  const interval = setInterval(()=>{
    i = (i+1) % loadingPhrases.length;
    phraseEl.textContent = loadingPhrases[i];
  }, 1300);

  try{
    const movies = await fetchRandom16();
    clearInterval(interval);
    bracket = movies;
    sessionMovies = movies;
    nextWinners = [];
    matchIndex = 0;
    roundName = ROUND_NAMES[bracket.length] || `${bracket.length}강전`;
    renderMatch();
    replaceWith('screen-round');
  }catch(e){
    clearInterval(interval);
    console.error(e);
    document.getElementById('startError').textContent = e.message || '문제가 생겼어요. 다시 시도해주세요';
    history.back();
  }
}

function renderMatch(){
  const a = bracket[matchIndex*2];
  const b = bracket[matchIndex*2+1];
  document.getElementById('imgA').src = a.poster;
  document.getElementById('titleA').textContent = a.title;
  document.getElementById('yearA').textContent = a.year;
  document.getElementById('imgB').src = b.poster;
  document.getElementById('titleB').textContent = b.title;
  document.getElementById('yearB').textContent = b.year;
  document.getElementById('roundLabel').textContent = roundName;
  document.getElementById('roundProgress').textContent = `${matchIndex+1} / ${bracket.length/2}매치`;
  requestAnimationFrame(() => requestAnimationFrame(positionRoundLabel));
}

let swapBusy = false;

async function swapMovie(which){
  if (choiceBusy || swapBusy) return;
  swapBusy = true;
  const btn = document.getElementById(which === 'A' ? 'swapA' : 'swapB');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '불러오는 중...';
  try{
    const current = which === 'A' ? bracket[matchIndex*2] : bracket[matchIndex*2+1];
    const excludeIds = new Set(bracket.map(m => String(m.id)));
    excludeIds.add(String(current.id));
    const replacement = await getSpareMovie(excludeIds);
    if (!replacement) return;
    if (which === 'A') bracket[matchIndex*2] = replacement;
    else bracket[matchIndex*2+1] = replacement;
    sessionMovies.push(replacement);
    renderMatch();
  }catch(e){
    console.error(e);
  }finally{
    swapBusy = false;
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

let choiceBusy = false;

async function choose(which){
  if (choiceBusy || swapBusy) return;
  choiceBusy = true;
  try{
    const picked = which === 'A' ? bracket[matchIndex*2] : bracket[matchIndex*2+1];
    await showRoundPopup(`${picked.title} 승리!`, 650);

    nextWinners.push(picked);
    matchIndex++;

    if (matchIndex * 2 < bracket.length){
      renderMatch();
      return;
    }

    if (nextWinners.length === 1){
      await finishTournament(nextWinners[0]);
      return;
    }

    bracket = nextWinners;
    nextWinners = [];
    matchIndex = 0;
    roundName = ROUND_NAMES[bracket.length] || `${bracket.length}강전`;
    document.getElementById('roundLabel').textContent = roundName;

    const popupText = ROUND_POPUP_TEXT[bracket.length];
    if (popupText) await showRoundPopup(popupText);
    renderMatch();
  } finally {
    choiceBusy = false;
  }
}

async function finishTournament(winner){
  document.getElementById('winnerPoster').src = winner.poster;
  document.getElementById('winnerTitle').textContent = winner.title;
  document.getElementById('winnerYear').textContent = winner.year;
  document.getElementById('resultError').textContent = '';

  try{
    const stats = await submitResult(winner);
    document.getElementById('myWinPct').textContent = `${stats.myWinPct}% (${stats.myWinCount}회 우승)`;

    const idToInfo = new Map();
    sessionMovies.forEach(m => idToInfo.set(String(m.id), m));
    idToInfo.set(String(winner.id), winner);

    const listEl = document.getElementById('leaderboardList');
    listEl.innerHTML = stats.leaderboard.map((row, i) => {
      const info = idToInfo.get(String(row.movieId));
      const name = info ? info.title : `영화 #${row.movieId}`;
      return `<div class="lb-row"><div class="lb-rank">${i+1}</div><div class="lb-name">${name}</div><div class="lb-wins">${row.wins}회</div></div>`;
    }).join('');
  }catch(e){
    console.error(e);
    document.getElementById('resultError').textContent = '통계를 불러오지 못했어요';
  }

  playCount++;
  replaceWith('screen-result');
}

function beginNewTournament(){
  // 다시 하기를 누르면 바로 재시작하지 않고, 카테고리 선택 화면으로 돌아가서
  // 어떤 영화로 월드컵을 할지 다시 고를 수 있게 해요.
  switchScreen('screen-start');
  history.replaceState({ screen: 'screen-start' }, '');
}

function playAgain(){
  if (playCount >= 1){
    document.getElementById('adModal').classList.add('show');
  } else {
    beginNewTournament();
  }
}

window.startTournament = startTournament;
window.choose = choose;
window.swapMovie = swapMovie;
window.playAgain = playAgain;
window.goTo = goTo;
</script>
