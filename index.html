<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 명작영화 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D12;
    --surface:#17151C;
    --surface-soft:#1F1C26;
    --gold:#D4AF37;
    --gold-deep:#A9832A;
    --gold-soft:#4A3F22;
    --ink:#F3EFE6;
    --ink-soft:#9C97A8;
    --ink-faint:#6B6678;
    --line:#2A2732;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100dvh;
    background:var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
  }
  .phone{
    width:100%;
    height:100dvh;
    background:var(--bg);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .screen.active{display:flex;}
  .screen.show{opacity:1; transform:translateY(0);}

  #screen-start{ align-items:center; justify-content:center; padding:32px 28px; text-align:center; }
  .start-emblem{
    width:76px; height:76px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
    margin-bottom:22px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:26px;
    line-height:1.4;
    margin:0 0 12px;
    color:var(--ink);
  }
  .start-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin-bottom:34px;
  }
  .cta{
    width:100%;
    max-width:260px;
    border:none;
    border-radius:999px;
    padding:15px 0;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:15.5px;
    color:#1A1610;
    background:linear-gradient(135deg, #F3D77A, var(--gold), var(--gold-deep));
    cursor:pointer;
    box-shadow:0 12px 26px rgba(212,175,55,0.28);
  }
  .cta:active{ transform:scale(0.98); }
  .cta.ghost{
    background:transparent;
    color:var(--gold);
    border:1.4px solid var(--gold-deep);
    box-shadow:none;
  }
  .error-msg{ font-size:12px; color:#E0665A; margin-top:14px; min-height:16px; }
  .category-list{
    width:100%; max-width:260px;
    display:flex; flex-direction:column; gap:10px;
  }

  #screen-genre{ align-items:center; justify-content:center; padding:32px 28px; text-align:center; }
  .genre-title{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:18px;
    color:var(--gold);
    margin-bottom:22px;
  }
  .genre-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
    max-width:300px;
    margin-bottom:22px;
  }
  .genre-btn{
    padding:14px 4px;
    border-radius:14px;
    border:1px solid var(--gold-deep);
    background:var(--surface);
    color:var(--ink);
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .genre-btn:active{ transform:scale(0.97); }

  #screen-lineup, #screen-reveal{
    align-items:center; text-align:center;
    padding:48px 18px 24px;
    overflow-y:auto;
  }
  .lineup-title{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:18px;
    color:var(--gold);
    margin-bottom:4px;
  }
  .lineup-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .lineup-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:9px;
    width:100%;
    margin-bottom:22px;
  }
  .lineup-card{
    position:relative;
    border-radius:8px;
    overflow:hidden;
  }
  .lineup-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
    background:var(--surface-soft);
  }
  .lineup-card-title{
    margin-top:4px;
    font-size:9.5px;
    line-height:1.25;
    color:var(--ink-soft);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .lineup-swap-btn{
    position:absolute; top:4px; right:4px; z-index:2;
    width:22px; height:22px; border-radius:50%;
    border:1px solid var(--gold-deep);
    background:rgba(14,13,18,0.75);
    color:var(--gold);
    font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .lineup-swap-btn:disabled{ opacity:0.4; cursor:default; }

  .reveal-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    width:100%;
    margin-bottom:26px;
  }
  .reveal-card{ border-radius:10px; overflow:hidden; }
  .reveal-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
    border-radius:8px;
    box-shadow:0 8px 18px rgba(0,0,0,0.4);
  }
  .reveal-card-title{
    margin-top:6px;
    font-size:10.5px;
    line-height:1.3;
    color:var(--ink);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .sound-toggle{
    position:absolute; top:14px; left:14px; z-index:50;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line, rgba(0,0,0,0.08));
    background:var(--card-bg, rgba(255,255,255,0.85));
    font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }

  #screen-loading{ align-items:center; justify-content:center; text-align:center; }
  .film-spin{
    width:40px; height:40px;
    border:3px solid var(--surface-soft);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ margin-top:16px; font-size:13.5px; color:var(--ink-soft); }

  #screen-round{ padding:0; position:relative; }
  .matchup{
    flex:1;
    position:relative;
    display:flex;
    gap:2px;
    padding:0 2px 2px;
  }
  .round-label{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:40px;
    z-index:6;
    white-space:nowrap;
    background:var(--surface);
    border:1px solid var(--gold-deep);
    border-radius:16px;
    padding:6px 18px;
    text-align:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.4);
  }
  .round-label-main{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:14px;
    color:var(--gold);
    line-height:1.3;
  }
  .round-label-sub{
    font-size:10.5px;
    font-weight:500;
    color:var(--ink-faint);
    line-height:1.3;
    margin-top:1px;
  }
  .movie-card{
    flex:1;
    position:relative;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    background-color:#110F15;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 28px;
  }
  .movie-card::before, .movie-card::after{
    content:"";
    position:absolute; top:0; bottom:0; width:28px;
    background-repeat:repeat-y;
    background-size:28px auto;
    z-index:1;
  }

<script type="module">
import { loadFullScreenAd, showFullScreenAd } from '@apps-in-toss/web-framework';

function safeIsSupported(fn){
  try { return !!fn(); } catch (e) { return false; }
}

// ⚠️ 배포한 백엔드의 실제 주소로 바꿔주세요.
const API_BASE = "https://movieworldcup.onrender.com";

let currentScreen = 'screen-start';
let bracket = [];
let nextWinners = [];
let matchIndex = 0;
let roundName = '16강전';
let playCount = 0;
let sessionMovies = [];
let currentCategory = 'all';
let currentGenreId = null;
let tournamentId = 0; // 토너먼트가 새로 시작될 때마다 올라가요. 이전 토너먼트에서 걸려있던
                       // 느린 요청(스왑 등)이 뒤늦게 끝나도 지금 토너먼트에 반영되지 않게 막아줘요.
let lineupMovies = []; // 16강전 시작 전, 미리보기 화면에서 바꿀 수 있는 16편
let pendingNextBracket = []; // 라운드가 끝난 뒤 "다음 라운드 시작" 버튼을 누르면 적용될 다음 대진표
let pendingAdAction = null; // 광고 확인 모달에서 "확인" 눌렀을 때 실행할 동작 (다시하기 / 다음 라운드 등 상황에 따라 달라져요)

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
  }[c]));
}

// ───────────────────────── 효과음 (Web Audio API로 직접 합성) ─────────────────────────
// 외부 음원 파일 없이 오실레이터로 효과음을 만들어요. 저작권 걱정이 없고 용량도 거의 안 들어요.
// 소리가 너무 얇고 가볍게 들리지 않도록, 음 하나당 (1) 기본음 (2) 살짝 detune된 겹음(코러스感)
// (3) 한 옥타브 아래 서브 오실레이터(저음感)를 같이 울리고, 로우패스 필터와 짧은 리버브를 더해
// 입체적으로 들리게 했어요.
let audioCtx = null;
let masterGain = null;
let reverbSend = null;
let soundEnabled = true;
try {
  soundEnabled = localStorage.getItem('moviecup_sound') !== 'off';
} catch (_) {}

function createReverbImpulse(ctx){
  const duration = 1.4, decay = 2.4, rate = ctx.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++){
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  const node = ctx.createConvolver();
  node.buffer = impulse;
  return node;
}

function getAudioCtx(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!audioCtx) {
    audioCtx = new Ctx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(audioCtx.destination);

    const reverb = createReverbImpulse(audioCtx);
    reverbSend = audioCtx.createGain();
    reverbSend.gain.value = 1;
    reverbSend.connect(reverb);
    reverb.connect(masterGain);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}

// 모바일 브라우저는 사용자가 화면을 처음 터치하기 전까지 소리 재생을 막아요.
// 그래서 앱에서 첫 번째로 발생하는 탭/클릭에서 미리 AudioContext를 깨워둬요.
function unlockAudioOnce(){
  getAudioCtx();
  document.removeEventListener('pointerdown', unlockAudioOnce);
  document.removeEventListener('click', unlockAudioOnce);
}
document.addEventListener('pointerdown', unlockAudioOnce, { once: true });
document.addEventListener('click', unlockAudioOnce, { once: true });

function playTone(ctx, freq, startTime, duration, opts = {}){
  const {
    type = 'triangle',
    gain = 0.14,
    sub = true,     // 한 옥타브 아래 서브 레이어 — 저음으로 소리에 무게감을 줘요.
    detune = 6,     // 살짝 어긋나게 겹치는 2번째 레이어 — 코러스처럼 두껍게 들려요.
    filterFreq = 2800,
    wet = 0.28,     // 리버브로 보내는 양 — 공간감("입체적")을 줘요.
  } = opts;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.value = 0.6;
  filter.frequency.setValueAtTime(Math.max(freq * 2.2, 500), startTime);
  filter.frequency.exponentialRampToValueAtTime(filterFreq, startTime + 0.025);

  const noteGain = ctx.createGain();
  noteGain.gain.setValueAtTime(0, startTime);
  noteGain.gain.linearRampToValueAtTime(gain, startTime + 0.016);
  noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  filter.connect(noteGain);
  noteGain.connect(masterGain);
  const wetGain = ctx.createGain();
  wetGain.gain.value = wet;
  noteGain.connect(wetGain);
  wetGain.connect(reverbSend);

  const stopAt = startTime + duration + 0.05;
  function addOsc(freqMul, oscType, levelMul, detuneCents){
    const osc = ctx.createOscillator();
    osc.type = oscType;
    osc.frequency.setValueAtTime(freq * freqMul, startTime);
    if (detuneCents) osc.detune.setValueAtTime(detuneCents, startTime);
    const oscGain = ctx.createGain();
    oscGain.gain.value = levelMul;
    osc.connect(oscGain).connect(filter);
    osc.start(startTime);
    osc.stop(stopAt);
  }

  addOsc(1, type, 1, 0);
  addOsc(1, type, 0.45, detune);
  if (sub) addOsc(0.5, 'sine', 0.4, 0);
}

function playNotes(notes, opts = {}){
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  notes.forEach(({ freq, delay, duration }) => playTone(ctx, freq, now + delay, duration, opts));
}

// 라운드 시작(16강전/8강전/4강전/결승) — 울림이 있는 3음 상승 팡파르
function playRoundStartSound(){
  playNotes([
    { freq: 392.00, delay: 0,    duration: 0.24 }, // G4
    { freq: 523.25, delay: 0.10, duration: 0.24 }, // C5
    { freq: 659.25, delay: 0.20, duration: 0.36 }, // E5
  ], { type: 'triangle', gain: 0.15, wet: 0.24 });
}

// 영화 선택(승리) 팝업 — 묵직하면서도 또렷한 '딩동'
function playWinSound(){
  playNotes([
    { freq: 587.33, delay: 0,    duration: 0.14 }, // D5
    { freq: 880.00, delay: 0.06, duration: 0.24 }, // A5
  ], { type: 'triangle', gain: 0.14, wet: 0.2 });
}

// 라운드/진출작 소개 — 차분한 코드 패드 위에 짧은 멜로디가 얹히는 소개용 음악
function playRevealJingle(){
  playNotes([
    { freq: 293.66, delay: 0, duration: 1.0 }, // D4 pad
    { freq: 369.99, delay: 0, duration: 1.0 }, // F#4 pad
    { freq: 440.00, delay: 0, duration: 1.0 }, // A4 pad
  ], { type: 'sine', gain: 0.055, sub: false, detune: 4, wet: 0.45 });
  playNotes([
    { freq: 587.33, delay: 0.05, duration: 0.28 }, // D5
    { freq: 698.46, delay: 0.24, duration: 0.28 }, // F#5
    { freq: 880.00, delay: 0.44, duration: 0.55 }, // A5
  ], { type: 'triangle', gain: 0.13, wet: 0.32 });
}

// 최종 우승 공개 — 풍성한 4음 팡파르 + 스파클
function playChampionSound(){
  playNotes([
    { freq: 392.00,  delay: 0,    duration: 0.24 }, // G4
    { freq: 523.25,  delay: 0.16, duration: 0.24 }, // C5
    { freq: 659.25,  delay: 0.32, duration: 0.24 }, // E5
    { freq: 783.99,  delay: 0.48, duration: 0.6  }, // G5
  ], { type: 'triangle', gain: 0.16, wet: 0.32 });
  playNotes([
    { freq: 1046.50, delay: 0.50, duration: 0.48 }, // C6 sparkle
    { freq: 1318.51, delay: 0.64, duration: 0.55 }, // E6 sparkle
  ], { type: 'sine', gain: 0.07, sub: false, wet: 0.4 });
}

function positionRoundLabel(){
  const img = document.getElementById('imgA');
  const matchup = document.querySelector('.matchup');
  const label = document.getElementById('roundLabel');
  if (!img || !matchup || !label) return;
  const imgRect = img.getBoundingClientRect();
  const matchupRect = matchup.getBoundingClientRect();
  if (imgRect.height === 0) return;
  const top = imgRect.top - matchupRect.top - label.offsetHeight - 10;
  label.style.top = Math.max(10, top) + 'px';
}

let screenSwitchToken = 0;
function switchScreen(id){
  if (id === currentScreen) return;
  document.getElementById(currentScreen).classList.remove('active','show');
  const next = document.getElementById(id);
  next.classList.add('active');
  // 화면이 아주 빠르게 연속으로 전환되면(API가 즉시 응답하는 경우 등), 이전 전환에서
  // 예약해둔 rAF 콜백이 뒤늦게 실행되면서 이미 바뀐 화면이 아닌 엉뚱한 화면에
  // show 클래스를 다시 붙이는 경우가 있어요. 토큰으로 "아직 내가 마지막 전환인지"
  // 확인해서, 그 사이에 다른 전환이 일어났으면 조용히 무시해요.
  const myToken = ++screenSwitchToken;
  requestAnimationFrame(()=> requestAnimationFrame(()=> {
    if (screenSwitchToken === myToken) next.classList.add('show');
  }));
  currentScreen = id;
}
function goTo(id){ history.pushState({ screen: id }, ''); switchScreen(id); }
function replaceWith(id){ history.replaceState({ screen: id }, ''); switchScreen(id); }

const AD_GROUP_ID_INTERSTITIAL = "ait.v2.live.82a2fa9ce30e4f21";
let interstitialLoaded = false;

function preloadInterstitial(){
  if (!safeIsSupported(() => loadFullScreenAd.isSupported())) return;
  interstitialLoaded = false;
  loadFullScreenAd({
    options: { adGroupId: AD_GROUP_ID_INTERSTITIAL },
    onEvent: (e) => { if (e.type === 'loaded') interstitialLoaded = true; },
    onError: (e) => console.error('전면 광고 로드 실패:', e),
  });
}
preloadInterstitial();

function withInterstitialIfNeeded(proceed){
  const shouldShowAd = interstitialLoaded && safeIsSupported(() => showFullScreenAd.isSupported());
  if (!shouldShowAd) { proceed(); return; }
  showFullScreenAd({
    options: { adGroupId: AD_GROUP_ID_INTERSTITIAL },
    onEvent: (e) => {
      if (e.type === 'dismissed' || e.type === 'failedToShow') { preloadInterstitial(); proceed(); }
    },
    onError: (e) => { console.error('전면 광고 노출 실패:', e); preloadInterstitial(); proceed(); },
  });
}

async function fetchRandom16(){
  const params = new URLSearchParams();
  params.set('category', currentCategory);
  if (currentCategory === 'genre' && currentGenreId) params.set('genre', String(currentGenreId));
  const response = await fetch(`${API_BASE}/api/movies/random16?${params.toString()}`, {
    signal: AbortSignal.timeout(60000)
  });
  if (!response.ok) {
    let message = `영화 목록을 불러오지 못했어요: ${response.status}`;
    try { const b = await response.json(); if (b?.error) message = b.error; } catch(_){}
    throw new Error(message);
  }
  const data = await response.json();
  return data.movies;
}

let spareQueue = [];

async function getSpareMovie(excludeIds){
  for (let attempt = 0; attempt < 6; attempt++){
    if (spareQueue.length === 0){
      const batch = await fetchRandom16();
      spareQueue.push(...batch);
    }
    const candidate = spareQueue.shift();
    if (candidate && !excludeIds.has(String(candidate.id))) return candidate;
  }
  return null;
}

async function submitResult(winner){
  const response = await fetch(`${API_BASE}/api/movies/result`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ winnerId: winner.id, winnerTitle: winner.title }),
    signal: AbortSignal.timeout(20000)
  });
  if (!response.ok) throw new Error(`결과 저장에 실패했어요: ${response.status}`);
  return await response.json();
}

async function startTournament(category = 'all', genreId = null){
  tournamentId++;
  currentCategory = category;
  currentGenreId = genreId;
  spareQueue = [];
  document.getElementById('startError').textContent = '';
  goTo('screen-loading');
  let i = 0;
  const phraseEl = document.getElementById('loadingText');
  const interval = setInterval(()=>{
    i = (i+1) % loadingPhrases.length;
    phraseEl.textContent = loadingPhrases[i];
  }, 1300);

  try{
    const movies = await fetchRandom16();
    clearInterval(interval);
    lineupMovies = movies;
    // sessionMovies는 리더보드에 표시할 "이번 토너먼트에 등장한 모든 영화" 목록이라
    // lineupMovies/bracket과는 별개의 배열이어야 해요. 같은 배열을 공유하면(참조 공유)
    // 스왑할 때마다 sessionMovies에 push하는 게 그 배열까지 같이 늘려버려서, 대진표
    // 길이가 스왑할 때마다 1씩 불어나며 "20강전" 같은 비정상적인 라운드가 생기는
    // 원인이 됐어요.
    sessionMovies = movies.slice();
    renderLineupGrid();
    replaceWith('screen-lineup');
    playRevealJingle();
  }catch(e){
    clearInterval(interval);
    console.error(e);
    document.getElementById('startError').textContent = e.message || '문제가 생겼어요. 다시 시도해주세요';
    history.back();
  }
}

function renderLineupGrid(){
  const grid = document.getElementById('lineupGrid');

    <div class="lineup-card">
      <img src="${m.poster}" alt="">
      <button type="button" class="lineup-swap-btn" data-index="${i}" onclick="swapLineupMovie(${i})">↻</button>
      <div class="lineup-card-title">${escapeHtml(m.title)}</div>
    </div>
  `).join('');
}

let lineupSwapBusy = false;

async function swapLineupMovie(index){
  if (lineupSwapBusy) return;
  lineupSwapBusy = true;
  const btn = document.querySelector(`.lineup-swap-btn[data-index="${index}"]`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const tournamentIdAtStart = tournamentId;
  try{
    const current = lineupMovies[index];
    const excludeIds = new Set(lineupMovies.map(m => String(m.id)));
    excludeIds.add(String(current.id));
    const replacement = await getSpareMovie(excludeIds);
    if (!replacement) return;
    // 기다리는 동안 토너먼트가 새로 시작되거나 이미 16강전으로 넘어갔다면
    // (아래 swapMovie와 같은 이유로) 이 결과는 버려요.
    if (tournamentId !== tournamentIdAtStart || index >= lineupMovies.length) return;
    lineupMovies[index] = replacement;
    sessionMovies.push(replacement);
    renderLineupGrid();
  }catch(e){
    console.error(e);
  }finally{
    lineupSwapBusy = false;
  }
}

let choiceBusy = false;

async function choose(which){
  if (choiceBusy) return;
  choiceBusy = true;
  try{
    const picked = which === 'A' ? bracket[matchIndex*2] : bracket[matchIndex*2+1];
    playWinSound();
    await showRoundPopup(`${picked.title} 승리!`, 650);

    nextWinners.push(picked);
    matchIndex++;

    if (matchIndex * 2 < bracket.length){
      renderMatch();
      return;
    }

    if (nextWinners.length === 1){
      await finishTournament(nextWinners[0]);
      return;
    }

    // 라운드가 끝났어요. 바로 다음 라운드로 넘어가지 않고, 이번 라운드를 통과한
    // 영화들을 한번에 보여주는 화면으로 가요. "다음 라운드 시작하기" 버튼을 눌러야
    // (라운드에 따라 광고를 본 뒤) 진짜로 다음 라운드가 시작돼요.
    showRoundReveal(nextWinners);
  } finally {
    choiceBusy = false;
  }
}

function showRoundReveal(winners){
  pendingNextBracket = winners;
  const config = REVEAL_CONFIG[winners.length] || {
    title: `${winners.length}강 진출작`, buttonLabel: '다음 라운드 시작하기', requiresAd: false,
  };
  document.getElementById('revealTitle').textContent = config.title;
  const btn = document.getElementById('revealNextBtn');
  btn.textContent = config.buttonLabel;
  btn.dataset.requiresAd = config.requiresAd ? '1' : '0';
  renderRevealGrid(winners);
  replaceWith('screen-reveal');
  playRevealJingle();
}

async function proceedToNextRound(){
  bracket = pendingNextBracket;
  nextWinners = [];
  matchIndex = 0;
  roundName = ROUND_NAMES[bracket.length] || `${bracket.length}강전`;
  replaceWith('screen-round');
  const popupText = ROUND_POPUP_TEXT[bracket.length];
  playRoundStartSound();
  if (popupText) await showRoundPopup(popupText);
  renderMatch();
}

document.getElementById('revealNextBtn').addEventListener('click', () => {
  const btn = document.getElementById('revealNextBtn');
  if (btn.dataset.requiresAd === '1'){
    showAdModal(proceedToNextRound, '짧은 광고를 보고<br>다음 라운드를 시작할게요');
  } else {
    proceedToNextRound();
  }
});

async function finishTournament(winner){
  document.getElementById('winnerPoster').src = winner.poster;
  document.getElementById('winnerTitle').textContent = winner.title;
  document.getElementById('winnerYear').textContent = winner.year;
  document.getElementById('resultError').textContent = '';
  playChampionSound();

  try{
    const stats = await submitResult(winner);
    document.getElementById('myWinPct').textContent = `${stats.myWinPct}% (${stats.myWinCount}회 우승)`;

    const idToInfo = new Map();
    sessionMovies.forEach(m => idToInfo.set(String(m.id), m));
    idToInfo.set(String(winner.id), winner);

    const listEl = document.getElementById('leaderboardList');
    listEl.innerHTML = stats.leaderboard.map((row, i) => {
      const info = idToInfo.get(String(row.movieId));
      const name = info ? info.title : `영화 #${row.movieId}`;
      return `<div class="lb-row"><div class="lb-rank">${i+1}</div><div class="lb-name">${name}</div><div class="lb-wins">${row.wins}회</div></div>`;
    }).join('');
  }catch(e){
    console.error(e);
    document.getElementById('resultError').textContent = '통계를 불러오지 못했어요';
  }

  playCount++;
  replaceWith('screen-result');
}

function beginNewTournament(){
  // 다시 하기를 누르면 바로 재시작하지 않고, 카테고리 선택 화면으로 돌아가서
  // 어떤 영화로 월드컵을 할지 다시 고를 수 있게 해요.
  switchScreen('screen-start');
  history.replaceState({ screen: 'screen-start' }, '');
}

function playAgain(){
  if (playCount >= 1){
    showAdModal(beginNewTournament, '짧은 광고를 보고<br>새 토너먼트를 시작할게요');
  } else {
    beginNewTournament();
  }
}

window.startTournament = startTournament;
window.choose = choose;
window.swapLineupMovie = swapLineupMovie;
window.confirmLineupAndStart = confirmLineupAndStart;
window.playAgain = playAgain;
window.goTo = goTo;
</script>
</body>
