<style>:root{--bg:#0e0d12;--surface:#17151c;--surface-soft:#1f1c26;--gold:#d4af37;--gold-deep:#a9832a;--gold-soft:#4a3f22;--ink:#f3efe6;--ink-soft:#9c97a8;--ink-faint:#6b6678;--line:#2a2732}*{box-sizing:border-box}html,body{height:100%;margin:0;padding:0}body{background:var(--bg);min-height:100dvh;color:var(--ink);font-family:Noto Sans KR,sans-serif}.phone{background:var(--bg);flex-direction:column;width:100%;height:100dvh;display:flex;position:relative;overflow:hidden}.screen{opacity:0;flex-direction:column;flex:1;transition:opacity .4s,transform .4s;display:none;transform:translateY(10px)}.screen.active{display:flex}.screen.show{opacity:1;transform:translateY(0)}#screen-start{text-align:center;justify-content:center;align-items:center;padding:32px 28px}.start-emblem{border:2px solid var(--gold);border-radius:50%;justify-content:center;align-items:center;width:76px;height:76px;margin-bottom:22px;font-size:30px;display:flex}h1{color:var(--ink);margin:0 0 12px;font-family:Noto Serif KR,serif;font-size:26px;font-weight:900;line-height:1.4}.start-sub{color:var(--ink-soft);margin-bottom:34px;font-size:13.5px;line-height:1.6}.cta{color:#1a1610;background:linear-gradient(135deg, #f3d77a, var(--gold), var(--gold-deep));cursor:pointer;border:none;border-radius:999px;width:100%;max-width:260px;padding:15px 0;font-family:Noto Serif KR,serif;font-size:15.5px;font-weight:700;box-shadow:0 12px 26px #d4af3747}.cta:active{transform:scale(.98)}.cta.ghost{color:var(--gold);border:1.4px solid var(--gold-deep);box-shadow:none;background:0 0}.error-msg{color:#e0665a;min-height:16px;margin-top:14px;font-size:12px}.category-list{flex-direction:column;gap:10px;width:100%;max-width:260px;display:flex}#screen-genre{text-align:center;justify-content:center;align-items:center;padding:32px 28px}.genre-title{color:var(--gold);margin-bottom:22px;font-family:Noto Serif KR,serif;font-size:18px;font-weight:700}.genre-grid{grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;margin-bottom:22px;display:grid}.genre-btn{border:1px solid var(--gold-deep);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:14px;padding:14px 4px;font-family:Noto Serif KR,serif;font-size:14px;font-weight:700}.genre-btn:active{transform:scale(.97)}#screen-lineup,#screen-reveal{text-align:center;align-items:center;padding:48px 18px 24px;overflow-y:auto}.lineup-title{color:var(--gold);margin-bottom:4px;font-family:Noto Serif KR,serif;font-size:18px;font-weight:700}.lineup-sub{color:var(--ink-soft);margin-bottom:18px;font-size:12px}.lineup-grid{grid-template-columns:repeat(4,1fr);gap:9px;width:100%;margin-bottom:22px;display:grid}.lineup-card{border-radius:8px;position:relative;overflow:hidden}.lineup-card img{aspect-ratio:2/3;object-fit:cover;background:var(--surface-soft);width:100%;display:block}.lineup-card-title{color:var(--ink-soft);-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:4px;font-size:9.5px;line-height:1.25;display:-webkit-box;overflow:hidden}.lineup-swap-btn{z-index:2;border:1px solid var(--gold-deep);width:22px;height:22px;color:var(--gold);cursor:pointer;background:#0e0d12bf;border-radius:50%;justify-content:center;align-items:center;font-size:11px;line-height:1;display:flex;position:absolute;top:4px;right:4px}.lineup-swap-btn:disabled{opacity:.4;cursor:default}.reveal-grid{grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-bottom:26px;display:grid}.reveal-card{border-radius:10px;overflow:hidden}.reveal-card img{aspect-ratio:2/3;object-fit:cover;border-radius:8px;width:100%;display:block;box-shadow:0 8px 18px #0006}.reveal-card-title{color:var(--ink);-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:6px;font-size:10.5px;line-height:1.3;display:-webkit-box;overflow:hidden}.sound-toggle{z-index:50;border:1px solid var(--line,#00000014);background:var(--card-bg,#ffffffd9);cursor:pointer;border-radius:50%;justify-content:center;align-items:center;width:34px;height:34px;font-size:16px;line-height:1;display:flex;position:absolute;top:14px;left:14px;box-shadow:0 2px 8px #00000014}#screen-loading{text-align:center;justify-content:center;align-items:center}.film-spin{border:3px solid var(--surface-soft);border-top-color:var(--gold);border-radius:50%;width:40px;height:40px;animation:.9s linear infinite spin}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{color:var(--ink-soft);margin-top:16px;font-size:13.5px}#screen-round{padding:0;position:relative}.matchup{flex:1;gap:2px;padding:0 2px 2px;display:flex;position:relative}.round-label{z-index:6;white-space:nowrap;background:var(--surface);border:1px solid var(--gold-deep);text-align:center;border-radius:16px;padding:6px 18px;position:absolute;top:40px;left:50%;transform:translate(-50%);box-shadow:0 6px 16px #0006}.round-label-main{color:var(--gold);font-family:Noto Serif KR,serif;font-size:14px;font-weight:700;line-height:1.3}.round-label-sub{color:var(--ink-faint);margin-top:1px;font-size:10.5px;font-weight:500;line-height:1.3}.movie-card{cursor:pointer;background-color:#110f15;border-radius:14px;flex:1;justify-content:center;align-items:center;padding:0 28px;display:flex;position:relative;overflow:hidden}.movie-card:before,.movie-card:after{content:"";z-index:1;background-repeat:repeat-y;background-size:28px;width:28px;position:absolute;top:0;bottom:0}.movie-card:before{background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFoAAABCCAIAAABYT1ajAAAMqElEQVR4nOVcW29bNxKeGZJHUmRFjpy6rlt0E6RuFykWLTbte//Fov+hv7JAiz5tb0naBN26BZr0EifxRdblHHJmH0ai6XNRLEWLIJuBYUg0D2f4cWY4M+Qx/vMf78FyRLWt3W53PB4fHx+PRiPn3O7u7t7e3ltvvbU5uEJERGSMAQARYWYRQcTacRa0i4h+IKIQwnQ6zfN8/z8/P378+OHDh4eHh8ycZVmWZcYYZtbOSiIye9yQBKYgT/569Om/Pv3ss89u3fr4aDT0SIWwXRKLRnr8+DEzE9HVq1d3dnb29vZu3rz55ptvvvv396JYCof+traetXaohSPiSEQiUhRFURS//Lz/008/ff311/fv3z8+Pi49EvnGwXHWDgAgPnDhFTgDWAAsDcc5pOczVCmdc9777e3tTz755OOPP3777be3t7ety4wxOpn4eAihadqqRLV8S+xU6a7/7dr7779//fr1zz///Msvv/ztt98uXbq0vb19enpKRFHaKLAlU+RT5zIAKIpi1gdERGgFOGpJRIbDYbfbvXr16s2bNz/66KMPP/xw <body>

<div class="phone">

  <button type="button" class="sound-toggle" id="soundToggle" aria-label="효과음 켜기/끄기">🔊</button>

  <div class="screen active" id="screen-start">
    <div class="start-emblem">🎬</div>
    <h1>나만의 명작영화<br>월드컵</h1>
    <div class="start-sub">어떤 영화로 월드컵을 즐길지 골라보세요.<br>16강부터 결승까지, 최고의 한 편을 뽑아보세요.</div>
    <div class="category-list">
      <button class="cta" onclick="startTournament('all')">모든 영화</button>
      <button class="cta ghost" onclick="goTo('screen-genre')">장르별 선택</button>
      <button class="cta ghost" onclick="startTournament('korean')">한국영화</button>
      <button class="cta ghost" onclick="startTournament('western')">서양영화</button>
      <button class="cta ghost" onclick="startTournament('asian')">아시아영화</button>
    </div>
    <div class="error-msg" id="startError"></div>
  </div>

  <div class="screen" id="screen-genre">
    <div class="genre-title">장르 선택</div>
    <div class="genre-grid" id="genreGrid"></div>
  </div>

  <div class="screen" id="screen-loading">
    <div class="film-spin"></div>
    <div class="loading-text" id="loadingText">필름을 고르는 중...</div>
  </div>

  <div class="screen" id="screen-lineup">
    <div class="lineup-title">대진표에 오를 16편</div>
    <div class="lineup-sub">마음에 안 드는 영화는 바꿔보세요</div>
    <div class="lineup-grid" id="lineupGrid"></div>
    <button class="cta" id="lineupStartBtn" onclick="confirmLineupAndStart()">16강전 시작하기</button>
  </div>

  <div class="screen" id="screen-reveal">
    <div class="lineup-title" id="revealTitle">8강 진출작</div>
    <div class="lineup-sub">이 영화들이 다음 라운드에 올라가요</div>
    <div class="reveal-grid" id="revealGrid"></div>
    <button class="cta" id="revealNextBtn">8강전 시작하기</button>
  </div>

  <div class="screen" id="screen-round">
    <div class="matchup">
      <div class="round-label" id="roundLabel">
        <div class="round-label-main" id="roundLabelMain">16강전</div>
        <div class="round-label-sub" id="roundMatchLabel">1경기</div>
      </div>
      <div class="movie-card" id="cardA" onclick="choose('A')">
        <div class="poster-wrap">
          <img id="imgA" src="" alt="">
          <div class="movie-title" id="titleA"></div>
          <div class="movie-year" id="yearA"></div>
        </div>
      </div>
      <div class="vs-mark">VS</div>
      <div class="movie-card" id="cardB" onclick="choose('B')">
        <div class="poster-wrap">
          <img id="imgB" src="" alt="">
          <div class="movie-title" id="titleB"></div>
          <div class="movie-year" id="yearB"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-result">
    <div class="result-eyebrow">🏆 당신의 우승작</div>
    <img class="winner-poster" id="winnerPoster" src="" alt="">
    <div class="winner-title" id="winnerTitle"></div>
    <div class="winner-year" id="winnerYear"></div>

    <div class="stat-box">
      <div class="stat-label">이 영화를 우승으로 뽑은 사람</div>
      <div class="stat-value" id="myWinPct">-</div>
    </div>

    <div class="leaderboard">
      <div class="lb-title">역대 우승 TOP 10</div>
      <div id="leaderboardList"></div>
    </div>

    <button class="cta" onclick="playAgain()">다시 하기</button>
    <div class="error-msg" id="resultError"></div>
  </div>

  <div class="round-popup" id="roundPopup">
    <div class="round-popup-card">
      <div class="round-popup-text" id="roundPopupText"></div>
    </div>
  </div>

  <div class="ad-modal" id="adModal">
    <div class="ad-modal-card">
      <div class="ad-modal-emoji">🎬</div>
      <div class="ad-modal-title">다음 상영 전 안내</div>
      <div class="ad-modal-desc" id="adModalDesc">짧은 광고를 보고<br>새 토너먼트를 시작할게요</div>
      <button class="ad-modal-btn" id="adModalConfirm">확인하고 광고 보기</button>
    </div>
  </div>

</div>

</body>
</html>
